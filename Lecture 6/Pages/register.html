<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coding Ninjas - Register</title>
</head>
<body>
  <header>
    <a href="index.html">
      <img src="../multimedia/new_cn_logo.svg" alt="Coding Ninjas Logo">
    </a>
    <h1>Create an Account</h1>
  </header>
  <hr>

  <main>
    <section id="registration-form">
      <form action="#" method="post">
        <fieldset>
          <legend>Professional Information</legend>
          <br>

          <label for="fullname">Full Name:</label>
          <input type="text" id="fullname" name="fullname" required>
          <br><br>

          <label for="email">Email:</label>
          <input type="email" id="email" name="email" required>
          <br><br>

          <label for="username">Username:</label>
          <input type="text" id="username" name="username" required>
          <br><br>

          <label for="password">Password:</label>
          <input type="password" id="password" name="password" required>
          <br><br>

          <label for="usertype">User Type:</label>
          <select name="usertype" id="usertype" required>
            <option value="" disabled selected>Select Your Type</option>
            <option value="student">Student</option>
            <option value="instructor">Instructor</option>
          </select>
          <br><br>

          <label for="cource">Select Course:</label>
          <select name="cource" id="cource" required>
            <option value="" disabled selected>Select Your Course</option>
            <option value="cource1">Course 1 - Web Development</option>
            <option value="cource2">Course 2 - Data Science Fundamentals</option>
            <option value="cource3">Course 3 - Digital Marketing Mastery</option>
            <option value="cource4">Course 4 - Android Development</option>
          </select>
          <br><br>

          <button type="submit">Register</button>
        </fieldset>
      </form>

    </section>
  </main>
</body>
</html>
