<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coding Ninjas - Contact</title>
  </head>
  <body>
    <header>
      <a href="index.html">
        <img src="../multimedia/new_cn_logo.svg" alt="Coding Ninjas Logo" />
      </a>
      <h1>Contact Us</h1>
    </header>
    <hr />

    <main>
      <section>
        <h2>Contact Details</h2>
        <p>For inquiries, you can reach us via email or phone:</p>
        <p>
          Email:
          <a href="mailto:contact@codingninjas.com"
            >contact@codingninjas.com</a
          >
        </p>
        <p>Phone: <a href="tel:1800-123-3598">1800-123-3598</a></p>
      </section>
      <hr />

      <section>
        <h2>Location Map</h2>
        <iframe
          src="https://www.google.com/maps/embed?pb=!1m16!1m12!1m3!1d3508.1075189338035!2d77.049246976271!3d28.44617507576708!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!2m1!1scoding%20ninjas%20gurgaon!5e0!3m2!1sen!2sin!4v1792653045437!5m2!1sen!2sin"
          width="600"
          height="450"
          allowfullscreen=""
        ></iframe>
      </section>
      <hr />
      <section id="feedback-form">
        <form action="#" method="post">
          <br />
          <fieldset>
            <legend><b>Feedback Form</b></legend>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required />
            <br /><br />

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required />
            <br /><br />

            <label for="subject">Subject:</label>
            <input type="text" id="subject" name="subject" required />
            <br /><br />

            <label for="message">Message:</label>
            <textarea
              name="message"
              id="message"
              cols="40"
              rows="5"
              required
            ></textarea>
            <br /><br />
            <input type="submit" value="Submit"/>
          </fieldset>
        </form>
      </section>
    </main>
  </body>
</html>
