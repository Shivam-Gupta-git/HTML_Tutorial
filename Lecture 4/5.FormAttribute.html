<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form Attributes</title>
  </head>

  <body>
    <h1>Please Schedule Your Trip</h1>

    <form action="successmessage.html" method="post">
      <fieldset>
        <legend>User Form</legend>

        <label for="Username">Username</label>
        <input
          type="text"
          id="Username"
          name="Username"
          placeholder="Enter or select username"
          list="usernames"
          required
        />

        <datalist id="usernames">
          <option value="Shivam"></option>
          <option value="Rahul"></option>
          <option value="Amit"></option>
        </datalist>

        <br /><br />

        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          minlength="4"
          maxlength="10"
          required
          placeholder="Enter your password"
        />

        <br /><br />

        <button type="submit">Submit</button>
      </fieldset>
    </form>
  </body>
</html>
