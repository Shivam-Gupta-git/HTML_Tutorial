<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <!-- <link rel="stylesheet" href="calculator.css" /> -->
    <style>
        .calculator {
            margin-left: 40%;
            border: 2px solid red;
            width: 300px;
        }

        #display {
            border-radius: 10px;
            width: 85%;
            height: 50px;
            margin-left: 19px;
            margin-top: 5px;
            font-size: 25px;
            text-align: center;
        }

        .button-container {
            margin-top: 10px;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
        }

        .button {
            margin: 3px;
            width: 60px;
            height: 60px;
            border-radius:50%;
            font-size: 20px;
            background-color: #505050;
            color: white;
        }
        .button:hover{
            background-color: #6a5d5d;
        }

        #yellow {
            background-color: #ff9500;
        }

        #gray {
            background-color: #d4d4d2;
            color: black;
        }

        #zero {
            width: 120px;
            border-radius: 30px;
        }
    </style>
</head>

<body>
    <div class="calculator">
        <input type="text" name="display" id="display" readonly />
        <div class="button-container">
            <button class="button" id="gray"
                onclick="currentDisplay=''; document.querySelector('#display').value=currentDisplay;">
                AC
            </button>

            <button class="button" id="gray"
                onclick="currentDisplay=currentDisplay+'Shivam Kumar'; document.querySelector('#display').value=currentDisplay;">
                ME
            </button>

            <button class="button" id="gray"
                onclick="currentDisplay=currentDisplay+'%'; document.querySelector('#display').value=currentDisplay;">
                %
            </button>

            <button class="button" id="yellow"
                onclick="currentDisplay=currentDisplay+'/'; document.querySelector('#display').value=currentDisplay;">
                /
            </button>

            <button class="button"
                onclick="currentDisplay=currentDisplay+'7'; document.querySelector('#display').value=currentDisplay;">
                7
            </button>
            <button class="button"
                onclick="currentDisplay=currentDisplay+'8'; document.querySelector('#display').value=currentDisplay;">
                8
            </button>
            <button class="button"
                onclick="currentDisplay=currentDisplay+'9'; document.querySelector('#display').value=currentDisplay;">
                9
            </button>
            <button class="button" id="yellow"
                onclick="currentDisplay=currentDisplay+'*'; document.querySelector('#display').value=currentDisplay;">
                *
            </button>

            <button class="button"
                onclick="currentDisplay=currentDisplay+'4'; document.querySelector('#display').value=currentDisplay;">
                4
            </button>
            <button class="button"
                onclick="currentDisplay=currentDisplay+'5'; document.querySelector('#display').value=currentDisplay;">
                5
            </button>
            <button class="button"
                onclick="currentDisplay=currentDisplay+'6'; document.querySelector('#display').value=currentDisplay;">
                6
            </button>
            <button class="button" id="yellow"
                onclick="currentDisplay=currentDisplay+'-'; document.querySelector('#display').value=currentDisplay;">
                -
            </button>

            <button class="button"
                onclick="currentDisplay=currentDisplay+'1'; document.querySelector('#display').value=currentDisplay;">
                1
            </button>

            <button class="button"
                onclick="currentDisplay=currentDisplay+'2'; document.querySelector('#display').value=currentDisplay;">
                2
            </button>

            <button class="button"
                onclick="currentDisplay=currentDisplay+'3'; document.querySelector('#display').value=currentDisplay;">
                3
            </button>

            <button class="button" id="yellow"
                onclick="currentDisplay=currentDisplay+'+'; document.querySelector('#display').value=currentDisplay;">
                +
            </button>

            <button class="button" id="zero"
                onclick="currentDisplay=currentDisplay+'0'; document.querySelector('#display').value=currentDisplay;">
                0
            </button>

            <button class="button"
                onclick="currentDisplay=currentDisplay+'.'; document.querySelector('#display').value=currentDisplay;">
                .
            </button>

            <button class="button" id="yellow" onclick="
            let result = eval(currentDisplay);
            currentDisplay=result; document.querySelector('#display').value=currentDisplay;">
                =
            </button>
        </div>
    </div>
    <script>
        let currentDisplay = "";
        document.querySelector("#display").value = currentDisplay;
    </script>
    <!-- <script src="calculator.js"></script> -->
</body>

</html>
