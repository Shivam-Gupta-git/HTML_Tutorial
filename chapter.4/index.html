<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML List</title>
</head>
<body>

    <!-- ul tag use to represent unordered list-->
    <!-- li tag is a type of list items-->
    <!-- use 3type-square,disk,circle under the ul tag-->

<ul type="square">   
    <li>about</li>
    <li>content</li>
    <li>services</li>
    <li>content</li>
</ul>

<!-- ol tag use to represent ordered list -->
<ol type="I">   
    <li>about</li>
    <li>content</li>
    <li>services</li>
    <li>content</li>
</ol>


</body>
</html>
